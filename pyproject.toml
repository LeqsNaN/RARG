[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rarg"
version = "0.1.0"
description = "RARG: retrieval-augmented agent code and experiment scripts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets",
    "faiss-cpu>=1.7.4",
    "httpx>=0.28.1",
    "huggingface-hub<1.0",
    "matplotlib",
    "numpy",
    "openai>=1.0.0",
    "pandas",
    "pyarrow",
    "scipy",
    "torch",
    "tqdm",
    "transformers>=4.44.0",
]

[project.scripts]
dci-export-bc-plus-docs = "dci.benchmark.export_bc_plus_docs:main"
dci-export-bright-docs = "dci.benchmark.export_bright_docs:main"

[project.optional-dependencies]
vllm = ["vllm>=0.6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/dci"]

[tool.uv]
index-url = "https://mirrors.cloud.tencent.com/pypi/simple"
